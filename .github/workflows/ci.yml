name: Alchemy runtime CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86-64:
    name: Linux x86-64 / Clang with SDL2 and SDL3
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.12"
          enable-cache: false
      - name: Install native verification tools and SDL runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang clang-format clang-tidy cmake ninja-build pkg-config libsdl2-dev libsdl3-dev
      - name: Build and execute libraries, viewers, semantic tests, and quality checks
        run: uv run --frozen python tools/verify.py --build-dir build/ci/linux-x86-64

  macos-arm64:
    name: macOS arm64 / Apple Clang with SDL2 and SDL3
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.12"
          enable-cache: false
      - name: Install native verification tools and SDL runtimes
        run: |
          brew install llvm ninja pkg-config sdl2 sdl3
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Build and execute libraries, viewers, semantic tests, and quality checks
        run: uv run --frozen python tools/verify.py --build-dir build/ci/macos-arm64

  windows-x86-64:
    name: Windows x86-64 / clang-cl with SDL2 and SDL3
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.12"
          enable-cache: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Build and execute libraries, viewers, semantic tests, and quality checks
        run: uv run --frozen python tools/verify.py --fetch-sdl --build-dir build/ci/windows-x86-64
