name: Alchemy runtime CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86-64:
    name: Linux x86-64 / Clang with SDL2 and SDL3
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install native verification tools and SDL runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang clang-format clang-tidy cmake ninja-build pkg-config libsdl2-dev libsdl3-dev
      - name: Configure and build the shared libraries and viewers
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build/ci/linux-x86-64 -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/ci/linux-x86-64 --parallel
      - name: Run parser, input, SDL, tooling, and quality tests
        run: ctest --test-dir build/ci/linux-x86-64 --output-on-failure

  macos-arm64:
    name: macOS arm64 / Apple Clang with SDL2 and SDL3
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install native verification tools and SDL runtimes
        run: |
          brew install llvm ninja pkg-config sdl2 sdl3
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Configure and build the shared libraries and viewers
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build/ci/macos-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/ci/macos-arm64 --parallel
      - name: Run parser, input, SDL, tooling, and quality tests
        run: ctest --test-dir build/ci/macos-arm64 --output-on-failure
